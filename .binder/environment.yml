# Runtime requirements come from pyproject.toml (installed by pip below).
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - jupyterlab
  - ffmpeg
  # CPU-only PyTorch (pip would otherwise download the CUDA build on Linux)
  - pytorch-cpu
  - pip:
      - pangeo-fish
      - jupyterhub==4.1.6
