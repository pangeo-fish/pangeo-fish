# Install the project from the repository root with: python -m pip install -e .
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - pip
  - jupyterlab
  - ipython
  - ipykernel
  - graphviz
  - python-graphviz
  - ffmpeg
  - papermill
  - jupyterlab_code_formatter
  - black
  - isort
  - pre-commit
  - jupyterlab-git
  - git
  - pytest
  - pytest-cov
