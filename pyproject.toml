[project]
name = "pangeo-fish"
authors = [{ name = "TAOS" }]
description = "Utilities for fish geolocation"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  # core scientific stack
  # Modern BinGrouper and Zarr-Python 3 integration; exercised in container CI.
  "xarray>=2025.7.1,<2027",
  "pandas",
  "numpy",
  "scipy",
  "numba",
  "sparse",
  "opt_einsum",
  "more_itertools",
  "toolz",
  # Zarr-Python 3 runtime; writers explicitly retain Zarr format 2.
  # Let the storage clients own their aiohttp/aiobotocore/numcodecs constraints.
  "zarr>=3.1.2,<4",
  "numcodecs",
  "kerchunk>=0.2.9,<0.3",
  "fsspec>=2025.7.0,<2027",
  "s3fs>=2025.7.0,<2027",
  "gcsfs>=2025.7.0,<2027",
  "h5netcdf",
  "intake",
  "intake-xarray>=2,<3",
  # geographic & HEALPix
  "healpy",
  # Numeric ellipsoid parameters used by DGGS export and xdggs 0.7.
  "healpix-geo>=0.3.0",
  "cartopy==0.25.0",
  "geopandas",
  "shapely",
  "movingpandas==0.21.3",
  "xhealpixify",
  # xdggs 0.7 requires Python >=3.12; retain the 0.6 line on Python 3.11.
  "xdggs>=0.6.0,<0.7; python_version < '3.12'",
  "xdggs>=0.7.0,<0.8; python_version >= '3.12'",
  "healpix-convolution",
  "foscat>=2026.6.1,<2027",
  "cf_xarray>=0.10.4",
  "pint",
  "pint-xarray",
  "eccodes>=2.35.0",
  "cdshealpix",
  "dask-image",
  "dask-hpcconfig",
  # distributed / parallel
  "dask",
  "distributed",
  "flox",
  # plotting / visualization
  "matplotlib",
  "hvplot",
  "holoviews",
  "geoviews",
  "altair",
  "cmocean",
  "imageio[ffmpeg]",
  "ipywidgets",
  # CLI / progress
  "rich",
  "rich-click",
  "tqdm",
  # Copernicus Marine Service client (default model loader)
  "copernicusmarine>=2.4,<3",
  # deep learning (CPU-only usage in notebooks via CUDA_VISIBLE_DEVICES="")
  "torch>=2.7,<3",
  "healpix-analyse>=2026.10.2,<2027",
  "healpix-resample>=2026.11.2,<2027",
]
dynamic = ["version"]

[project.optional-dependencies]
notebooks = ["papermill>=2.7,<3", "ipykernel>=6.29,<8"]

[project.urls]
"Homepage" = "https://github.com/pangeo-fish/pangeo-fish"

[project.scripts]
pangeo-fish = "pangeo_fish.cli:main"

[tool.setuptools.packages.find]
where = [""]
include = ["pangeo_fish*"]
namespaces = false

[build-system]
requires = [
  "setuptools>=77.0.0",
  "wheel",
  "setuptools_scm[toml]>=3.4",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "999"

[tool.coverage.run]
source = ["pangeo_fish"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING"]

[tool.ruff]
builtins = ["ellipsis"]
exclude = [
  ".git",
  ".eggs",
  "build",
  "dist",
  "__pycache__",
  "docs",
]
target-version = "py310"

extend-include = ["*.ipynb"]
line-length = 100

[tool.ruff.lint]
ignore = [
  "E203",  # whitespace before ':' - doesn't work well with black
  "E402",  # module level import not at top of file
  "E501",  # line too long - let black worry about that
  "E731",  # do not assign a lambda expression, use a def
  "UP038", # use type union instead of tuple of types - type union is slower
]
select = [
  "F",   # Pyflakes
  "E",   # Pycodestyle
  "I",   # isort
  "UP",  # Pyupgrade
  "TID", # tidy imports
]
extend-safe-fixes = [
  "TID252", # absolute imports
]
fixable = ["I", "TID", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pangeo_fish"]
known-third-party = []

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["pangeo_fish/tests"]
filterwarnings = [
  "error:::pangeo_fish.*",
  "ignore:Missing optional dependencies. To use the trajectory smoother classes please install Stone Soup:UserWarning:movingpandas",
  "ignore:Specifying VariableLengthTuple:DeprecationWarning:traitlets",
]
