# Keep runtime dependencies in pyproject.toml; no independent scientific-stack pins.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - pip
  - jupyterlab
  - ffmpeg
  - python-dotenv
  - docutils<0.21
  - sphinx>=9.0
  - sphinx-book-theme
  - sphinx-copybutton
  - sphinx-remove-toctrees
  - myst-parser
  - nbsphinx
  - pip:
      - nbsphinx_link>=1.3.1
      - -e ../.
